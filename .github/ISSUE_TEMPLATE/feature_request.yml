name: Feature request
about: Suggest a change to Aldad
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "الضاد تفضّل القواعد القليلة والواضحة. وضّح المشكلة أولاً قبل اقتراح أمر جديد."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: ما المشكلة التي لا تستطيع القواعد الحالية حلها بوضوح؟
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example Aldad code
      render: text
