name: Bug report
about: Report a reproducible problem in Aldad
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "شكراً لمساعدة الضاد. اكتب مثالاً صغيراً يعيد المشكلة."
  - type: input
    id: version
    attributes:
      label: Aldad version
      placeholder: 1.9.17 Preview
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - VS Code extension
        - Other
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Aldad code
      description: أصغر كود يكرر المشكلة
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / error
    validations:
      required: true
