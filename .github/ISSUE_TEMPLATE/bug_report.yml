name: Bug report
description: Report a reproducible problem in Aldad
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Aldad version
      placeholder: 1.9.17 Preview
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - VS Code extension
        - Other
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Aldad code
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result or error
    validations:
      required: true
